<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - QuizBattle</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .auth-orb {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168,85,247,0.12) 0%, transparent 70%);
      filter: blur(60px);
      animation: float 10s ease-in-out infinite;
      pointer-events: none;
    }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 1;
    }

    .auth-card h1 {
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-card .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-footer a { font-weight: 600; }

    .theme-corner {
      position: absolute;
      top: 16px;
      right: 16px;
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .step-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--input-border);
      transition: var(--transition);
    }

    .step-dot.active { background: var(--accent); transform: scale(1.2); }
    .step-dot.done { background: var(--success); }

    .step-panel { display: none; }
    .step-panel.active { display: block; animation: fadeIn 0.3s ease; }

    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn-group .btn { flex: 1; }

    .preview-card {
      text-align: center;
      padding: 32px 24px;
    }

    .preview-card h3 { margin-bottom: 4px; }
    .preview-card p { color: var(--text-secondary); }
  </style>
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>

  <div class="auth-page">
    <div class="auth-orb"></div>
    <div class="auth-card">
      <div class="theme-corner">
        <button class="theme-toggle" onclick="Theme.toggle()" aria-label="Toggle theme">
          <div class="knob"><div class="icon-sun"></div><div class="icon-moon"></div></div>
        </button>
      </div>

      <h1>Create Account</h1>
      <p class="subtitle">Join QuizBattle and start competing</p>

      <div class="step-indicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
      </div>

      <!-- Step 1 -->
      <div class="step-panel active" id="step1">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" class="form-control" id="regName" placeholder="e.g., Juan Dela Cruz">
        </div>
        <div class="form-group">
          <label>Year / Section</label>
          <input type="text" class="form-control" id="regYear" placeholder="e.g., Grade 11 - Newton">
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="goToStep(2)">Next</button>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="step-panel" id="step2">
        <div class="card preview-card">
          <h3 id="previewName"></h3>
          <p id="previewYear"></p>
        </div>
        <div class="btn-group">
          <button class="btn btn-outline" onclick="goToStep(1)">Back</button>
          <button class="btn btn-success btn-lg" onclick="completeRegistration()" style="flex:2;">Create Account</button>
        </div>
      </div>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
      <div style="text-align:center; margin-top:16px;">
        <a href="../index.html" style="color:var(--text-muted); font-size:0.85rem;">Back to Home</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    let currentStep = 1;

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Auth.init();
      if (user) window.location.href = 'dashboard.html';
    });

    function goToStep(step) {
      if (step === 2 && currentStep === 1) {
        const name = document.getElementById('regName').value.trim();
        const year = document.getElementById('regYear').value.trim();
        if (!name) return Utils.showToast('Please enter your name', 'error');
        if (!year) return Utils.showToast('Please enter your year/section', 'error');
        document.getElementById('previewName').textContent = name;
        document.getElementById('previewYear').textContent = year;
      }

      document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`step${step}`).classList.add('active');

      document.querySelectorAll('.step-dot').forEach((d, i) => {
        d.classList.remove('active', 'done');
        if (i + 1 < step) d.classList.add('done');
        if (i + 1 === step) d.classList.add('active');
      });

      currentStep = step;
    }

    async function completeRegistration() {
      const name = document.getElementById('regName').value.trim();
      const year = document.getElementById('regYear').value.trim();

      Utils.showLoading();
      const result = await Auth.registerStudent(name, year);
      Utils.hideLoading();

      if (result.success) {
        Utils.showToast('Account created!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } else {
        Utils.showToast(result.error, 'error');
      }
    }
  </script>
</body>
</html>
