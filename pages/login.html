<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - QuizBattle</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .auth-orb {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
      filter: blur(60px);
      animation: float 10s ease-in-out infinite;
      pointer-events: none;
    }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
    }

    .auth-card h1 {
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-card .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-footer a { font-weight: 600; }

    .theme-corner {
      position: absolute;
      top: 16px;
      right: 16px;
    }

    .tab-group {
      display: flex;
      gap: 4px;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 28px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
      transition: var(--transition);
    }

    .tab-btn.active {
      background: var(--bg);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    [data-theme="dark"] .tab-btn.active {
      background: #16161F;
    }
  </style>
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>

  <div class="auth-page">
    <div class="auth-orb"></div>
    <div class="auth-card">
      <div class="theme-corner">
        <button class="theme-toggle" onclick="Theme.toggle()" aria-label="Toggle theme">
          <div class="knob">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </div>
        </button>
      </div>

      <h1>Welcome Back</h1>
      <p class="subtitle">Login to your QuizBattle account</p>

      <div class="tab-group">
        <button class="tab-btn active" onclick="switchLoginTab('student')">Student</button>
        <button class="tab-btn" onclick="switchLoginTab('admin')">Admin</button>
      </div>

      <!-- Student Login -->
      <div id="studentTab">
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" id="studentEmail" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="studentPassword" placeholder="Enter password" style="padding-right:45px;">
            <button type="button" class="eye-btn" onclick="togglePass('studentPassword', this)" aria-label="Toggle password visibility">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary btn-lg" style="width:100%;" onclick="studentLogin()">Login</button>
        <p class="auth-footer">
          No account? <a href="register.html">Register here</a>
        </p>
      </div>

      <!-- Admin Login -->
      <div id="adminTab" style="display:none;">
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" id="adminEmail" placeholder="admin@school.edu">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="adminPassword" placeholder="Enter password" style="padding-right:45px;">
            <button type="button" class="eye-btn" onclick="togglePass('adminPassword', this)" aria-label="Toggle password visibility">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary btn-lg" style="width:100%;" onclick="adminLogin()">Login as Admin</button>
        <p class="auth-footer">
          First time? <a href="setup-admin.html">Create Admin Account</a>
        </p>
      </div>

      <div style="text-align:center; margin-top:20px;">
        <a href="../index.html" style="color:var(--text-muted); font-size:0.85rem;">Back to Home</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Auth.init();
      if (user) {
        const isAdmin = await Auth.checkAdminStatus(user.id);
        window.location.href = isAdmin ? 'admin.html' : 'dashboard.html';
      }
    });

    function switchLoginTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('studentTab').style.display = tab === 'student' ? 'block' : 'none';
      document.getElementById('adminTab').style.display = tab === 'admin' ? 'block' : 'none';
    }

    function togglePass(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const eyeOpen = btn.querySelector('.eye-open');
      const eyeClosed = btn.querySelector('.eye-closed');
      if (field.type === 'password') {
        field.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
      } else {
        field.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
      }
    }

    async function studentLogin() {
      const email = document.getElementById('studentEmail').value.trim();
      const password = document.getElementById('studentPassword').value;
      if (!email || !password) return Utils.showToast('Fill in all fields', 'error');

      localStorage.setItem('qb_credentials', JSON.stringify({ email, password }));

      Utils.showLoading();
      const result = await Auth.loginStudent();
      Utils.hideLoading();

      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        Utils.showToast(result.error, 'error');
      }
    }

    async function adminLogin() {
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      if (!email || !password) return Utils.showToast('Fill in all fields', 'error');

      Utils.showLoading();
      const result = await Auth.loginAdmin(email, password);
      Utils.hideLoading();

      if (result.success) {
        window.location.href = 'admin.html';
      } else {
        Utils.showToast(result.error, 'error');
      }
    }
  </script>
</body>
</html>
