<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - QuizBattle</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .dash-page { min-height: 100vh; background: var(--bg); }
    .dash-content { max-width: 860px; margin: 0 auto; padding: 32px 20px; }

    .profile-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 28px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .profile-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 800;
      color: var(--accent);
      flex-shrink: 0;
    }

    .profile-info h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 2px; }
    .profile-info p { color: var(--text-secondary); font-size: 0.9rem; }

    .profile-stats {
      display: flex; gap: 28px;
      margin-left: auto;
    }

    .join-section {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 36px;
      text-align: center;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
      backdrop-filter: blur(12px);
    }

    .join-section h3 { margin-bottom: 12px; font-weight: 700; }
    .join-section p { color: var(--text-secondary); margin-bottom: 24px; }

    .results-section {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .results-section h3 { margin-bottom: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>

  <div class="dash-page">
    <nav class="navbar">
      <a href="dashboard.html" class="navbar-brand">QuizBattle <span>Student</span></a>
      <div class="navbar-actions">
        <button class="btn btn-primary btn-sm" onclick="joinGameModal()">Join Game</button>
        <button class="theme-toggle" onclick="Theme.toggle()" aria-label="Toggle theme">
          <div class="knob"><div class="icon-sun"></div><div class="icon-moon"></div></div>
        </button>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
      </div>
    </nav>

    <div class="dash-content">
      <div class="profile-card">
        <div class="profile-avatar" id="userAvatar">?</div>
        <div class="profile-info">
          <h2 id="userName"></h2>
          <p id="userYear"></p>
        </div>
        <div class="profile-stats">
          <div style="text-align:center;">
            <div class="stat-value" id="totalPoints">0</div>
            <div class="stat-label">Points</div>
          </div>
          <div style="text-align:center;">
            <div class="stat-value" id="gamesPlayed">0</div>
            <div class="stat-label">Games</div>
          </div>
        </div>
      </div>

      <div class="join-section">
        <h3>Ready to Compete?</h3>
        <p>Ask your teacher for the game code and join the quiz</p>
        <button class="btn btn-primary btn-lg" onclick="joinGameModal()">Join Game</button>
      </div>

      <div class="results-section">
        <h3>Previous Results</h3>
        <div id="resultsContainer">
          <div class="empty-state">
            <p>No games played yet. Join a game to get started!</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Join Modal -->
  <div class="modal-overlay" id="joinModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Join a Game</h3>
        <button class="modal-close" onclick="closeJoinModal()">&times;</button>
      </div>
      <div class="form-group">
        <label>Enter 6-Digit Game Code</label>
        <div class="game-code-input" id="codeInputs">
          <input type="text" maxlength="1" oninput="handleCodeInput(this, 0)">
          <input type="text" maxlength="1" oninput="handleCodeInput(this, 1)">
          <input type="text" maxlength="1" oninput="handleCodeInput(this, 2)">
          <input type="text" maxlength="1" oninput="handleCodeInput(this, 3)">
          <input type="text" maxlength="1" oninput="handleCodeInput(this, 4)">
          <input type="text" maxlength="1" oninput="handleCodeInput(this, 5)">
        </div>
      </div>
      <button class="btn btn-primary btn-lg" style="width:100%;" onclick="submitGameCode()">Join</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    let userData = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Auth.init();
      if (!user) { window.location.href = 'login.html'; return; }
      if (Auth.isAdmin) { window.location.href = 'admin.html'; return; }
      await loadUserProfile(user.id);
      await loadPreviousResults(user.id);
    });

    async function loadUserProfile(uid) {
      const { data } = await supabaseClient.from('user_profiles').select('*').eq('id', uid).single();
      if (!data) {
        const stored = JSON.parse(localStorage.getItem('qb_profile') || '{}');
        if (stored.name) {
          await supabaseClient.from('user_profiles').upsert({
            id: uid, name: stored.name, year_section: stored.yearSection || '',
            is_guest: false, total_points: 0, games_played: 0
          }, { onConflict: 'id', ignoreDuplicates: true });
          const { data: r } = await supabaseClient.from('user_profiles').select('*').eq('id', uid).single();
          if (r) { userData = r; renderProfile(r); return; }
        }
        window.location.href = 'register.html';
        return;
      }
      userData = data;
      renderProfile(data);
    }

    function renderProfile(d) {
      document.getElementById('userAvatar').textContent = d.name ? d.name.charAt(0).toUpperCase() : '?';
      document.getElementById('userName').textContent = d.name;
      document.getElementById('userYear').textContent = d.year_section || '';
      document.getElementById('totalPoints').textContent = d.total_points || 0;
      document.getElementById('gamesPlayed').textContent = d.games_played || 0;
    }

    async function loadPreviousResults(uid) {
      const { data } = await supabaseClient.from('leaderboards').select('*').eq('user_id', uid).order('played_at', { ascending: false }).limit(10);
      const c = document.getElementById('resultsContainer');
      if (!data || data.length === 0) { c.innerHTML = '<div class="empty-state"><p>No games played yet. Join a game to get started!</p></div>'; return; }
      let html = '';
      data.forEach(r => {
        html += `<div class="result-item">
          <div class="result-icon">${(r.quiz_title || 'Q').charAt(0)}</div>
          <div class="result-info"><h4>${Utils.sanitize(r.quiz_title || 'Quiz')}</h4><p>${r.correct_count || 0}/${r.total_questions || 0} correct</p></div>
          <div class="result-score">${r.total_score || 0} pts</div>
        </div>`;
      });
      c.innerHTML = html;
    }

    function joinGameModal() {
      document.getElementById('joinModal').classList.add('active');
      document.querySelector('#codeInputs input').focus();
    }

    function closeJoinModal() { document.getElementById('joinModal').classList.remove('active'); }

    function handleCodeInput(input, index) {
      input.value = input.value.toUpperCase();
      if (input.value && index < 5) document.querySelectorAll('#codeInputs input')[index + 1].focus();
    }

    function submitGameCode() {
      const code = Array.from(document.querySelectorAll('#codeInputs input')).map(i => i.value).join('');
      if (code.length !== 6) return Utils.showToast('Enter all 6 digits', 'error');
      window.location.href = `game.html?code=${code}`;
    }

    async function logout() { await Auth.logout(); window.location.href = '../index.html'; }
  </script>
</body>
</html>
